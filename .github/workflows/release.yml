---
# Standardized Release Workflow for Crossplane Providers
# Version: 2026-06-09 - Unified publish pattern across all providers
#
# Pattern:
# 1. Build provider binaries and packages (make build)
# 2. Publish to GHCR in a SINGLE step using make publish with both:
#    - REGISTRY_ORGS for Docker images
#    - XPKG_REG_ORGS for Crossplane packages
# 3. Create GitHub release
#
# Triggered on version tags (v*)

name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.27.0'

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Vendor Dependencies
        run: |
          go mod vendor
          make vendor.check

      - name: Extract Version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

